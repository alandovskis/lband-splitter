# L-Band Splitter/Combiner Configuration File
# Version 1.0.0

[system]
# System identification
name = "L-Band Splitter/Combiner"
hardware_version = "1.0"
software_version = "1.0.0"

# Number of ports (fixed at 32)
num_ports = 32

# System health monitoring
health_check_interval = 30  # seconds
error_recovery_enabled = true

[gpio]
# GPIO base addresses for port control
enable_led_base = 100   # GPIO 100-131 for port enable LEDs
signal_led_base = 132   # GPIO 132-163 for signal detection LEDs

# GPIO export/unexport on startup/shutdown
auto_export = true
auto_unexport = true

[frequency_detection]
# Frequency monitoring settings
update_interval = 100         # milliseconds
signal_threshold = -80.0      # dBm
frequency_range_min = 1000.0  # MHz (L-band start)
frequency_range_max = 2000.0  # MHz (L-band end)

# Calibration settings
auto_calibrate_on_startup = true
calibration_interval = 86400  # seconds (daily)

# ADC configuration
adc_resolution = 16           # bits
adc_reference_voltage = 3.3   # volts

[netconf]
# NetConf server settings
enabled = true
bind_address = "0.0.0.0"
port = 830

# YANG model configuration
yang_models_path = "/usr/local/share/yang/modules"
datastore_path = "/var/lib/splitter/datastore"

# Authentication (simplified for demonstration)
# In production, use proper SSH keys and certificates
auth_method = "password"
username = "admin"
password = "admin123"

# Session settings
session_timeout = 3600        # seconds
max_concurrent_sessions = 10

[web]
# REST API server settings
enabled = true
bind_address = "0.0.0.0"
port = 8080

# Static file serving for Angular app
document_root = "/var/www/splitter"
enable_cors = true

# API settings
api_version = "v1"
request_timeout = 30          # seconds
max_request_size = 1048576    # bytes (1MB)

# SSL/TLS (disabled for development)
ssl_enabled = false
ssl_certificate = "/etc/ssl/certs/splitter.crt"
ssl_private_key = "/etc/ssl/private/splitter.key"

[logging]
# Logging configuration
log_level = "info"            # debug, info, warning, error
log_file = "/var/log/splitter/splitter.log"
max_log_size = 10485760       # bytes (10MB)
max_log_files = 5

# Console logging
console_logging = true
console_log_level = "info"

# Syslog integration
syslog_enabled = true
syslog_facility = "daemon"

[ports]
# Default port configuration
# Individual ports can be configured via NetConf or web interface

# Default state for all ports on startup
default_enabled = false

# Default signal detection threshold per port
default_signal_threshold = -80.0  # dBm

# Port descriptions (can be overridden per port)
port_0_description = "Input Port 1"
port_1_description = "Input Port 2"
port_2_description = "Input Port 3"
port_3_description = "Input Port 4"
# ... (additional ports would be configured here)

# Port groups for bulk operations
input_ports = "0-15"          # Ports 0-15 are inputs
output_ports = "16-31"        # Ports 16-31 are outputs

[hardware]
# Hardware-specific settings
gpio_chip = "/dev/gpiochip0"
spi_bus = "/dev/spidev0.0"
i2c_bus = "/dev/i2c-1"

# ADC configuration for frequency detection
adc_chip = "ADS1115"
adc_i2c_address = 0x48

# Display configuration for port frequency displays
display_type = "SSD1306"
display_i2c_addresses = "0x3C,0x3D,0x3E,0x3F"  # Multiple displays

# Hardware monitoring
temperature_sensor_enabled = true
temperature_sensor_path = "/sys/class/thermal/thermal_zone0/temp"
temperature_warning_threshold = 70.0   # Celsius
temperature_critical_threshold = 85.0  # Celsius

[performance]
# Performance tuning
thread_pool_size = 8
max_concurrent_operations = 16
buffer_size = 4096            # bytes

# Memory management
enable_memory_pooling = true
max_memory_usage = 268435456  # bytes (256MB)

# Network settings
tcp_keepalive = true
tcp_nodelay = true

[security]
# Security settings (basic configuration)
# In production, implement proper security measures

enable_access_control = false
allowed_networks = "192.168.0.0/16,10.0.0.0/8,127.0.0.0/8"
denied_networks = ""

# Rate limiting
enable_rate_limiting = true
max_requests_per_second = 100
max_requests_per_minute = 1000

# Authentication tokens
token_expiry = 3600           # seconds
refresh_token_expiry = 86400  # seconds