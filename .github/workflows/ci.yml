name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"

env:
  FUZZ_ITERATIONS: 50

jobs:
  android:
    name: Android (API ${{ matrix.api }} / ${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 34]
        device: ["Pixel_4", "Pixel_6_Pro"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Override fuzz iterations for nightly
        if: github.event_name == 'schedule'
        run: echo "FUZZ_ITERATIONS=500" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew :app:assembleDebug

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Instrumented Tests (with fuzz)
        run: |
          echo "Launching emulator ${{ matrix.device }} (API ${{ matrix.api }})"
          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.api=${{ matrix.api }} \
            -Pandroid.testInstrumentationRunnerArguments.device=${{ matrix.device }}
        env:
          FUZZ_ENABLED: true
          FUZZ_SEED: ${{ github.run_id }}
          FUZZ_ITERATIONS: ${{ env.FUZZ_ITERATIONS }}

      - name: Collect First 3 Screenshots
        if: failure()
        run: |
          mkdir -p summary_screenshots
          find . -type f -name "*.png" | head -n 3 | while read f; do
            cp "$f" summary_screenshots/
          done

      - name: Upload Failure Screenshots (Android)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-api-${{ matrix.api }}-${{ matrix.device }}
          path: '**/*.png'

      - name: Embed Screenshots in Summary
        if: failure()
        run: |
          echo "## 📸 UI Test Failure Screenshots" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          LABEL="Android API ${{ matrix.api }} – ${{
            matrix.device
          }}"
          echo "### $LABEL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          mkdir -p tmp_cmds
          ALL_CMDS_ANDROID=""

          for f in summary_screenshots/*.png; do
            name=$(basename "$f" .png)
            echo "**Test:** \`$name\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "![]($f)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            CMD="./gradlew connectedAndroidTest -Pfuzz.seed=${{ github.run_id }} -PonlyTest=$name"
            echo "[▶️ Replay this test](${CMD})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$name|${{ matrix.api }}|# $LABEL – $name\n$CMD" >> tmp_cmds/android.txt
          done

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🔁 Aggregate Replay Commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Shown **once per platform**. If a test failed on multiple devices, only the lowest API/OS version is listed below." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run these locally to reproduce all failing tests with the same fuzz seed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          if [[ -f tmp_cmds/android.txt ]]; then
            sort -t"|" -k2n tmp_cmds/android.txt \
              | awk -F"|" '!seen[$1]++ {print $3}' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  ios:
    name: iOS (Xcode ${{ matrix.xcode }} / iOS ${{ matrix.ios }} / ${{ matrix.device }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.0"]
        ios: ["17.5"]
        device: ["iPhone SE (3rd generation)", "iPhone 15 Pro Max"]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Override fuzz iterations for nightly
        if: github.event_name == 'schedule'
        run: echo "FUZZ_ITERATIONS=500" >> $GITHUB_ENV

      - name: Build
        run: echo "iOS build placeholder"

      - name: Run Unit + UI Tests (with fuzz)
        run: echo "iOS tests placeholder"
