version: "3.8"
services:
  webserver:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - daemon
  daemon:
    build:
      context: .
      dockerfile: docker/daemon.Dockerfile
    ports:
      - "9002:9002"
  webapp:
    build:
      context: .
      dockerfile: docker/webapp.Dockerfile
    ports:
      - "4200:80"
