<mat-card>
  <mat-card-title>Port Status</mat-card-title>
  <div *ngIf="statuses; else loading" class="table-wrapper">
    <table mat-table [dataSource]="statuses" class="mat-elevation-z1">
      <ng-container matColumnDef="port">
        <th mat-header-cell *matHeaderCellDef>Port</th>
        <td mat-cell *matCellDef="let s">{{ s.port }}</td>
      </ng-container>

      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef>Enabled</th>
        <td mat-cell *matCellDef="let s">
          <mat-icon color="primary" *ngIf="s.enabled">check_circle</mat-icon>
          <mat-icon color="warn" *ngIf="!s.enabled">cancel</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="frequency">
        <th mat-header-cell *matHeaderCellDef>Frequency (MHz)</th>
        <td mat-cell *matCellDef="let s">{{ s.frequencyHz / 1_000_000 | number:'1.0-2' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</mat-card>
<ng-template #loading>
  <div class="loading"><mat-spinner></mat-spinner></div>
</ng-template>
